<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a56"><link rel="manifest" href="manifest.webmanifest">
<title>JUNO AI</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#eef3f9;color:#14213d}
header{background:#102a56;color:white;padding:24px 18px;border-radius:0 0 28px 28px}
h1{margin:0;font-size:36px}.sub{font-size:18px;margin-top:8px}
.card{background:white;margin:18px;border-radius:22px;padding:20px;box-shadow:0 5px 18px #0001}
textarea{width:100%;box-sizing:border-box;border:1px solid #ccd5e2;border-radius:14px;padding:14px;font-size:16px;min-height:90px}
button{background:#102a56;color:white;border:0;border-radius:13px;padding:13px 16px;font-weight:bold;font-size:15px;margin:6px 4px 0 0}
.answer{white-space:pre-wrap;background:#f4f7fb;padding:15px;border-radius:14px;margin-top:12px;min-height:40px}.small{color:#68758a;font-size:14px}
</style></head><body>
<header><h1>🚀 JUNO AI</h1><div class="sub">Student • Study • Career • Business • Games</div></header>
<div class="card"><h2>🤖 JUNO AI Assistant</h2>
<p class="small">Study, Class 11, career, business aur daily goals ke baare me pucho.</p>
<textarea id="q" placeholder="Example: Class 11 me Science ya Commerce kaise choose karu?"></textarea><br>
<button onclick="ask()">Ask JUNO</button><button onclick="quick('Mere liye 2 ghante ka study plan banao.')">Study Plan</button>
<button onclick="quick('Mujhe 5 low-budget student business ideas batao.')">Business</button>
<div id="a" class="answer">JUNO yahan answer dega.</div></div>
<div class="card"><h2>⚡ Offline Smart Help</h2>
<p class="small">Internet na ho tab bhi basic guidance chalegi.</p>
<button onclick="quick('Mujhe padhai me focus karne ke 5 practical tips do.')">Focus Tips</button>
<button onclick="quick('Class 11 ke streams aur common career options samjhao.')">Class 11</button>
<button onclick="quick('Aaj ka simple student mission banao.')">Daily Mission</button></div>
<script>
const offline={focus:"1) Phone distractions kam karo.\n2) 25–30 min focused session rakho.\n3) Har session ka ek clear target rakho.\n4) 5 min break lo.\n5) Agle din ke 3 tasks likho.",
class11:"Science: Maths/Science based paths. Commerce: accounts, business, finance aur related paths. Humanities/Arts: languages, social sciences, law, design aur many other paths. Interest, strengths aur future plan dekhkar choose karo.",
business:"Low-budget ideas: tutoring, notes/design service, local digital help, reselling, simple content editing. Pehle skill + small test, phir investment badhao.",
mission:"🎯 Aaj ka mission:\n• 45 min focused study\n• 10 questions practice\n• 20 min revision\n• Kal ke 3 tasks likho."};
function quick(t){document.getElementById("q").value=t;ask()}
function localAnswer(q){q=q.toLowerCase();if(q.includes("focus"))return offline.focus;if(q.includes("11")||q.includes("stream"))return offline.class11;if(q.includes("business"))return offline.business;if(q.includes("mission"))return offline.mission;return "Offline mode me basic answer available hai. Internet milne par JUNO ke real AI backend ko connect kiya ja sakta hai."}
async function ask(){const q=document.getElementById("q").value.trim();if(!q)return;const a=document.getElementById("a");a.textContent="JUNO soch raha hai…";try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:q})});if(!r.ok)throw 0;const d=await r.json();a.textContent=d.answer||localAnswer(q)}catch(e){a.textContent=localAnswer(q)}}
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
